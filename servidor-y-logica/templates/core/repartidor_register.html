{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; padding: 2rem;">
  <div style="background: white; padding: 4rem; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); max-width: 450px; width: 100%; border: 1px solid #e2e8f0;">
    
    <div style="text-align: center; margin-bottom: 3rem;">
        <h2 style="font-size: 2.2rem; font-weight: 800; color: #0F172A; margin-bottom: 0.5rem;">Reclutamiento Logístico</h2>
        <p style="font-size: 1.3rem; color: #64748B;">Crea tu perfil motorizado para el escuadrón.</p>
    </div>

    {% if error %}
    <div style="background: #FEE2E2; color: #EF4444; padding: 1.2rem; border-radius: 8px; margin-bottom: 2rem; font-size: 1.2rem; text-align: center;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div style="margin-bottom: 1.5rem;">
        <label style="display:block; font-size:1.2rem; font-weight:600; color:#475569; margin-bottom:0.5rem;">Nombre Completo</label>
        <input type="text" name="nombre_completo" required value="{{ nombre_completo|default:'' }}"
               style="width: 100%; padding: 1.2rem; font-size: 1.4rem; border: 2px solid #E2E8F0; border-radius: 10px; outline: none; transition: border-color 0.3s;"
               placeholder="Ej: Juan Pérez">
      </div>
      
      <div style="margin-bottom: 1.5rem;">
        <label style="display:block; font-size:1.2rem; font-weight:600; color:#475569; margin-bottom:0.5rem;">Alias en Radio</label>
        <input type="text" name="nombre_usuario" required value="{{ nombre_usuario|default:'' }}"
               style="width: 100%; padding: 1.2rem; font-size: 1.4rem; border: 2px solid #E2E8F0; border-radius: 10px; outline: none; transition: border-color 0.3s;"
               placeholder="Ej: motorizado_123">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display:block; font-size:1.2rem; font-weight:600; color:#475569; margin-bottom:0.5rem;">Correo Oficial</label>
        <input type="email" name="correo" required value="{{ correo|default:'' }}"
               style="width: 100%; padding: 1.2rem; font-size: 1.4rem; border: 2px solid #E2E8F0; border-radius: 10px; outline: none; transition: border-color 0.3s;"
               placeholder="motorizado@empresa.com">
      </div>
      
      <div style="margin-bottom: 2.5rem;">
        <label style="display:block; font-size:1.2rem; font-weight:600; color:#475569; margin-bottom:0.5rem;">Contraseña Logística</label>
        <input type="password" name="clave" required 
               style="width: 100%; padding: 1.2rem; font-size: 1.4rem; border: 2px solid #E2E8F0; border-radius: 10px; outline: none; transition: border-color 0.3s;">
      </div>
      
      <button type="submit" style="width: 100%; padding: 1.4rem; background: #0F172A; color: white; border: none; border-radius: 10px; font-size: 1.4rem; font-weight: 700; cursor: pointer; transition: background 0.2s;">
        Crear Perfil Motorizado
      </button>
    </form>
    
    <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #E2E8F0;">
      <a href="{% url 'core:repartidor_login' %}" style="color: #64748B; font-size: 1.3rem; text-decoration: none;">&larr; Volver al acceso logístico</a>
    </div>
  </div>
</div>
{% endblock %}
