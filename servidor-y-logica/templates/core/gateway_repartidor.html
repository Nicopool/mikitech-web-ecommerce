{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; padding: 2rem;">
  <div style="background: white; padding: 4rem; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); max-width: 450px; width: 100%; text-align: center; border: 1px solid #e2e8f0;">
    
    <div style="background: #E0F2FE; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem auto;">
      <span class="material-symbols-outlined" style="font-size: 3.6rem; color: #0284C7;">local_shipping</span>
    </div>

    <h2 style="font-size: 2.4rem; font-weight: 800; color: #0F172A; margin-bottom: 1rem;">Portal Logístico</h2>
    <p style="font-size: 1.4rem; color: #64748B; margin-bottom: 3rem;">Ingresa el código de autorización para acceder a las rutas de entrega.</p>

    {% if error %}
    <div style="background: #FEE2E2; color: #EF4444; padding: 1.2rem; border-radius: 8px; margin-bottom: 2rem; font-size: 1.3rem; font-weight: 600;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div style="margin-bottom: 2rem;">
        <input type="password" name="codigo_secreto" required placeholder="Código de Repartidor" 
               style="width: 100%; padding: 1.4rem; font-size: 1.6rem; border: 2px solid #E2E8F0; border-radius: 12px; text-align: center; font-weight: 700; letter-spacing: 2px; outline: none; transition: all 0.3s;"
               onfocus="this.style.borderColor='#0284C7'; this.style.boxShadow='0 0 0 4px rgba(2, 132, 199, 0.1)';"
               onblur="this.style.borderColor='#E2E8F0'; this.style.boxShadow='none';">
      </div>
      <button type="submit" style="width: 100%; padding: 1.4rem; background: #0F172A; color: white; border: none; border-radius: 12px; font-size: 1.5rem; font-weight: 700; cursor: pointer; transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;">
        Verificar Acceso <span class="material-symbols-outlined" style="font-size: 2rem;">arrow_forward</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
